name: Build MedBuddy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Correct Android SDK installation
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      # Install required Android API and build tools
      - name: Install Android Packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Extract the uploaded project ZIP
      - name: Extract MedBuddy Project
        run: |
          if [ ! -f MedBuddy_Native_Android_With_Permissions.zip ]; then
            echo "ERROR: MedBuddy ZIP file not found in repository root."
            exit 1
          fi

          mkdir -p MedBuddyProject

          unzip -o MedBuddy_Native_Android_With_Permissions.zip \
            -d MedBuddyProject

          cp -a MedBuddyProject/. .

          echo "MedBuddy project extracted successfully."

          ls -la
          ls -la app

      # Install Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Build APK
      - name: Build MedBuddy APK
        run: |
          gradle --no-daemon assembleDebug

      # Upload APK
      - name: Upload MedBuddy APK
        uses: actions/upload-artifact@v4
        with:
          name: MedBuddy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
