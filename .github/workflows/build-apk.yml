name: Build MedBuddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MedBuddy ZIP
        run: |
          ZIP_FILE="MedBuddy_VOICE_ONLY_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            exit 1
          fi

          mkdir -p MedBuddyProject
          unzip -o "$ZIP_FILE" -d MedBuddyProject

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/MedBuddyProject" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found!"
            find MedBuddyProject -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f -name app-debug.apk | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MedBuddy.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedBuddy-APK
          path: MedBuddy.apk
          if-no-files-found: error
          retention-days: 30
