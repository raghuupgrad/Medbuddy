name: Build MedBuddy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MedBuddy ZIP
        run: |
          if [ ! -f MedBuddy_Previous_Design_Native.zip ]; then
            echo "MedBuddy ZIP not found!"
            exit 1
          fi

          mkdir -p MedBuddyProject

          unzip -o MedBuddy_Previous_Design_Native.zip \
            -d MedBuddyProject

          cp -a MedBuddyProject/. .

          echo "Project extracted successfully"

      - name: Verify Project Files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/medbuddy/reminder/MainActivity.java

      - name: Build MedBuddy APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload MedBuddy APK
        uses: actions/upload-artifact@v4
        with:
          name: MedBuddy-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
