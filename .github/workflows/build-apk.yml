name: Build MedBuddy Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MedBuddy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract MedBuddy ZIP
        run: |
          mkdir -p MedBuddyProject
          unzip -o MedBuddy_Android_APK_GitHub_Source.zip -d MedBuddyProject

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: MedBuddyProject
        run: gradle assembleDebug

      - name: Upload MedBuddy APK
        uses: actions/upload-artifact@v4
        with:
          name: MedBuddy-Android-APK
          path: MedBuddyProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
