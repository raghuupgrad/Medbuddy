name: Build MedBuddy Full-Screen APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Full-Screen MedBuddy ZIP
        run: |
          ZIP_FILE="MedBuddy_FULLSCREEN_UI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: MedBuddy_FULLSCREEN_UI.zip not found!"
            ls -la
            exit 1
          fi

          mkdir -p MedBuddyProject
          unzip -o "$ZIP_FILE" -d MedBuddyProject

      - name: Build MedBuddy APK
        run: |
          cd MedBuddyProject/MedBuddy_VOICE_ONLY_PROJECT
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedBuddy-FullScreen-APK
          path: MedBuddyProject/MedBuddy_VOICE_ONLY_PROJECT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
